name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hogulink_test
          POSTGRES_PASSWORD: ci_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm exec -w @hogulink/web -- next typegen
      - run: npm run check
      - run: npm run smoke:accounts
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/hogulink_test
